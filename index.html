    S.player=newPlayer(d);if(m.mode==='existing'){S.needChar=0;UI.modal=null;log('good','Meet '+S.player.name+', owner of '+S.ranchName+'.');return}
    UI.modal={type:'tutintro',lock:1}},
  editlook:()=>{UI.pdraft={name:S.player.name,bg:S.player.bg,look:{...S.player.look}};UI.modal={type:'creator',mode:'edit'}},
  tocreator:()=>{UI.pdraft=defaultDraft();UI.modal={type:'creator',lock:1,mode:'existing'}},
  tutskip:()=>{UI.modal={type:'gift',lock:1}},
  giftpick:d=>{const h=H(d.id);if(!h)return;freeGear(h.id);const g=JSON.parse(JSON.stringify(h));g.ageDays=age(h);UI.gift=g;UI.modal={type:'path',lock:1}},
  pathpick:d=>{const el=document.getElementById('rName');if(el)UI.rname=el.value;buildRanch(d.p,UI.gift);UI.gift=null;UI.tab='stable';UI.modal={type:'welcome'}},
  loanpay:d=>{const l=S.bank.loans.find(x=>x.id==d.id);if(!l)return;const amt=d.v==='due'?l.due:d.v==='all'?Math.ceil(l.bal):+d.v;const paid=payLoan(l,amt,d.v==='all'?'Paid off: '+l.name:d.v==='due'?'Payment: '+l.name:'Extra payment: '+l.name);toast(paid?'Paid '+money(paid)+'.':'Not enough money.')},
  autopay:()=>{S.bank.autopay=S.bank.autopay?0:1},
  borrow:(d,b)=>{const off=loanOffer();const amt=+d.v;if(!off||amt>off.max)return;if(!b.classList.contains('armed')){b.classList.add('armed');b.textContent='Tap again: borrow '+money(amt)+' at '+(off.rate*100).toFixed(1)+'%';return 'skip'}addLoan('Ranch loan #'+S.bank.nextLoanId,amt,off.rate,16,4);pxp('biz',2);toast('The bank deposited '+money(amt)+'.')},
  bailyes:()=>{bailout();UI.modal=null},
  gameover:()=>{S.phase='gameover';UI.modal={type:'gameover',lock:1}},
  buy:d=>buy(+d.i),
  sell:(d,b)=>{const h=H(d.id);if(!h)return;if(!b.classList.contains('armed')){b.classList.add('armed');b.textContent='Tap again to sell for '+money(saleValue(h));return 'skip'}sell(h,saleValue(h))},
  studyes:d=>{const r=S.studReq.find(x=>x.id===+d.id);const h=H(d.id);if(!r||!h)return;if(!canWork(h)||h.energy<20)return toast(h.name+' can’t cover a mare today.');
    h.acted=S.day;h.energy=clamp(h.energy-20,0,100);h.studCount=(h.studCount||0)+1;{const bonus=Math.round(r.fee*(mgrOf().inc-1));r.fee+=bonus}h.studEarned=(h.studEarned||0)+r.fee;h.earnings=(h.earnings||0)+r.fee;S.money+=r.fee;
    let extra='';if(r.fee>=800){gainRep(1);extra=' Your ranch’s name spreads (+1 reputation).'}
    S.studReq=S.studReq.filter(x=>x!==r);unlock('studsvc');log('good',h.name+' covered a mare from '+r.who+' Ranch for '+money(r.fee)+'.'+extra);toast('Earned '+money(r.fee)+' in stud fees.'+extra)},
  studno:d=>{S.studReq=S.studReq.filter(x=>x.id!==+d.id);toast('Request declined.')},
  accept:d=>{const o=S.offers.find(x=>x.id===+d.id);const h=H(d.id);if(o&&h)sell(h,o.amt,'offer from '+o.who)},
  decline:d=>{S.offers=S.offers.filter(x=>x.id!==+d.id);toast('Offer declined.')},
  rename:d=>{const h=H(d.id);const v=($('#renameInput')||{}).value;if(h&&v&&v.trim()){h.name=v.trim().slice(0,28);register(h);toast('Renamed to '+h.name+'.')}},
  renameRanch:()=>{const v=($('#ranchInput')||{}).value;if(v&&v.trim()){S.ranchName=v.trim().slice(0,32);toast('Ranch renamed.')}},
  hay:d=>{const n=+d.n;const cost=Math.round(S.hayPrice*n*(n>=150?.9:n>=50?.95:1)*(1-(psk('biz')-1)*.03));pxp('biz',1);tutMark('hay');if(S.money<cost)return toast('Not enough money.');S.money-=cost;S.hay=Math.round((S.hay+n)*10)/10;toast('Bought '+n+' bales for '+money(cost)+'.')},
  stalls:()=>{const c=1200+S.stallLevel*800;if(S.money<c)return;S.money-=c;S.stalls+=2;S.stallLevel++;log('info','Built 2 new stalls for '+money(c)+'.');toast('Two new stalls built.')},
  breed:()=>breed(),
  gobreed:d=>{UI.breedMare=String(d.id);UI.tab='breeding';UI.modal=null},
  gocomp:d=>{UI.compHorse=String(d.id);UI.tab='compete';UI.modal=null},
  compete:d=>compete(H(UI.compHorse),+d.e,+d.t),
  job:d=>{const h=H(d.id);if(h)doJob(h,d.j)},
  chore:d=>doChore(d.k),
  hire:(d,b)=>{const x=STAFF.find(y=>y.id===d.s);if(!x)return;if(!roleOpen(x))return toast(x.lock+'.');const a=(S.applicants[x.id]||[])[+d.i];if(!a)return;
    const fee=signFee(a,x.id);if(S.money<fee)return toast(a.name+' wants '+money(fee)+' to sign on. Not enough money.');
    if(S.staff[x.id]){if(!b.classList.contains('armed')){b.classList.add('armed');b.textContent='Tap again to replace';return 'skip'}log('info',S.staff[x.id].name+' was replaced as '+x.n+'.')}S.money-=fee;if(fee)log('info','Paid '+a.name+' a '+money(fee)+' signing bonus.');a.hired=S.day;a.happy=65;S.staff[x.id]=a;S.applicants[x.id].splice(+d.i,1);log('info','Hired '+a.name+' as '+x.n+' (skill '+a.skill+').');toast(a.name+' starts work tomorrow morning. Wage '+money(wageOf(a,x.id))+' a day.')},
  fire:(d,b)=>{const x=STAFF.find(y=>y.id===d.s);const p=x&&S.staff[x.id];if(!p)return;if(!b.classList.contains('armed')){b.classList.add('armed');b.textContent='Tap again to let go';return 'skip'}S.staff[x.id]=null;log('info','Let '+p.name+' go from the '+x.n+' job.');toast(p.name+' packed up and left.')},
  autovet:()=>{S.autoVet=S.autoVet?0:1;toast('Seasonal vet checkups '+(S.autoVet?'on':'off')+'.')},
  autotrain:()=>{S.autoTrain=S.autoTrain?0:1;toast('Auto-training '+(S.autoTrain?'on':'off')+'.')},
  upgrade:d=>{const u=UPGRADES.find(x=>x.id===d.u);if(!u||S.upgrades[u.id])return;if(S.money<u.cost)return toast('Not enough money.');S.money-=u.cost;S.upgrades[u.id]=S.day;log('info','Built a '+u.n+' for '+money(u.cost)+'.');toast(u.n+' built!')},
  savenow:()=>{save();toast(lastSaveOk?'Game saved. (It also saves by itself after every click.)':'This browser is blocking saves. Use Menu → Download save file.')},
  slotsave:d=>{S.savedAt=new Date().toLocaleString();try{localStorage.setItem(slotKey(d.n),JSON.stringify(S));toast('Saved to slot '+d.n+'.')}catch(e){toast('Storage is blocked here. Use a backup code instead.')}},
  slotload:(d,b)=>{if(!b.classList.contains('armed')){b.classList.add('armed');b.textContent='Tap again to load';return 'skip'}
    try{const t=localStorage.getItem(slotKey(d.n));const x=t&&JSON.parse(t);if(!validSave(x))throw 0;loadState(x,'Loaded slot '+d.n+': '+x.ranchName+', day '+x.day+'.')}catch(e){toast('That slot couldn’t be loaded.')}},
  makecode:async(d,b)=>{if(UI.code){const ok=await copyText(UI.code,$('#codeBox'));toast(ok?'Code copied. Paste it somewhere safe.':'Select the code and copy it.');return 'skip'}
    b.disabled=true;b.textContent='Making code…';try{UI.code=await makeCode();render();const ok=await copyText(UI.code,$('#codeBox'));toast(ok?'Transfer code made and copied. Paste it somewhere safe.':'Transfer code made. Select it and copy it.')}catch(e){b.disabled=false;b.textContent='Make transfer code';toast('Couldn’t make a code here. Download a save file instead.')}return 'skip'},
  loadcode:async()=>{const v=($('#pasteBox')||{}).value||'';if(!v.trim()){toast('Paste a transfer code in the box first.');return 'skip'}try{const x=await readCode(v);loadState(x,'Loaded '+x.ranchName+', day '+x.day+'.');render()}catch(e){toast('That code didn’t work. Make sure you copied all of it.')}return 'skip'},
  download:()=>{downloadSave();return 'skip'},
  tview:d=>{UI.tview=d.v},
  tcontinue:()=>{const x=load();if(!x){toast('No autosave found.');return}S=x;UI={tab:'stable',modal:null,breedMare:'',breedSire:'',compHorse:''};enterGame()},
  tnew:()=>{if(hasAutosave()){UI.tview='new';return}startNewLife();UI.screen='game';stopTitleAnim()},
  tnewyes:()=>{startNewLife();UI.screen='game';UI.tview='main';stopTitleAnim()},
  tkeep:d=>{try{const t=localStorage.getItem(KEY);localStorage.setItem(slotKey(d.n),t);toast('Your ranch is kept in slot '+d.n+'.')}catch(e){toast('Couldn’t save to that slot here.')}},
  pref:d=>{const v=d.k==='theme'?d.v:+d.v;PREF[d.k]=v;if(d.k==='sfx'||d.k==='music')PREF.mute=false;savePref();auUnlock();if(d.k==='sfx'&&v>0)setTimeout(()=>sfx('coin'),60);if(UI.screen!=='title')return},
  wipeall:(d,b)=>{if(!b.classList.contains('armed')){b.classList.add('armed');b.textContent='Tap again to erase';return 'skip'}try{[KEY,slotKey(1),slotKey(2),slotKey(3)].forEach(k=>localStorage.removeItem(k))}catch(e){}S=null;UI={tab:'stable',modal:null,screen:'title',tview:'main'};toast('All saves in this browser were erased.');render();return 'skip'},
  menu:()=>{save();UI.screen='title';UI.tview='main';UI.modal=null;UI.code=null},
  buyitem:d=>{const id=S.shop[+d.i];const it=ITEMS[id];if(!it)return;if(S.money<it.p)return toast('Not enough money.');S.money-=it.p;S.inv.push({uid:S.nextItem++,id,on:null});if(it.r!=='common')S.shop.splice(+d.i,1);log('info','Bought '+it.n+' ('+RARITY[it.r].n+') for '+money(it.p)+'.');toast('Bought the '+it.n+'. It’s in your tack room.')},
  crate:()=>{if(S.money<crateCost())return toast('Not enough money.');S.money-=crateCost();const x=grantItem(rollRarity(CRATE));const it=ITEMS[x.id];log(it.r==='legendary'||it.r==='epic'?'good':'info','Opened a crate: '+it.n+' ('+RARITY[it.r].n+').');UI.modal={type:'reveal',id:x.id}},
  autogear:()=>{const n=autoEquip();toast(n?'Put on '+n+' piece'+(n>1?'s':'')+' of spare gear.':'No spare gear fits any open slots.')},
  bestgear:()=>{const n=optimizeGear();toast(n?'Moved '+n+' piece'+(n>1?'s':'')+' of gear so every horse has its best fit.':'Everyone already has their best gear.')},
  autogear1:d=>{const h=H(d.id);if(!h)return;const n=autoEquip(h);toast(n?h.name+' put on '+n+' piece'+(n>1?'s':'')+' of spare gear.':'No spare gear fits '+h.name+'’s open slots.')},
  bestgear1:d=>{const h=H(d.id);if(!h)return;const n=optimizeGear(h);toast(n?'Moved '+n+' piece'+(n>1?'s':'')+' of gear. '+h.name+' now has the best fit in every slot.':h.name+' already has the best gear you own.')},
  sendaway:(d,b)=>{const h=S.horses.find(x=>x.id==UI.awayH&&canSendAway(x))||S.horses.find(canSendAway);if(!h)return;const days=+UI.awayD||8;const c=CENTERS.find(x=>x.id===d.c);
    if(!b.classList.contains('armed')){b.classList.add('armed');b.textContent='Tap again: send '+h.name+' for '+money(stayCost(c,days));return 'skip'}sendAway(h,d.c,days)},
  bringhome:d=>{const a=S.away.find(x=>x.h.id==d.id);if(!a)return;const c=CENTERS.find(x=>x.id===a.c);const left=Math.max(0,a.until-S.day);const ref=Math.round(c.cost*left*.5/10)*10;S.money+=ref;comeHome(a,null,true);if(ref)log('info','Refund for unused days: '+money(ref)+'.')},
  awaytab:d=>{UI.awayH=String(d.id);UI.tab='boarding';UI.modal=null},
  acceptclient:d=>acceptClient(+d.i),
  declineclient:d=>{S.boardReq.splice(+d.i,1);toast('You turned down the request.')},
  unequip:d=>{const x=S.inv.find(y=>y.uid===+d.u);if(x){x.on=null;toast('Took off the '+ITEMS[x.id].n+'.')}},
  sellitem:d=>{const i=S.inv.findIndex(y=>y.uid===+d.u);if(i<0)return;const it=ITEMS[S.inv[i].id];S.money+=Math.round(it.p*sellRate());S.inv.splice(i,1);toast('Sold the '+it.n+' for '+money(it.p*sellRate())+'.')},
  hnav:d=>{navHorse(+d.d)},
  pastpapers:d=>{UI.modal={type:'horse',id:+d.id,mode:'past'}},
  takesponsor:()=>{const b=SPONSORS.find(x=>x.id===S.sponsorOffer);if(!b)return;S.sponsor={id:b.id,since:S.day,weeks:4,strikes:0};S.sponsorOffer=null;S.weekStarts=0;log('good','Signed a sponsorship with '+b.n+' ('+money(b.pay)+' a week).');toast('Sponsorship signed!')},
  nosponsor:()=>{S.sponsorOffer=null;toast('Offer declined.')},
  dropsponsor:(d,b)=>{if(!b.classList.contains('armed')){b.classList.add('armed');b.textContent='Tap again to end';return 'skip'}const sp=SPONSORS.find(x=>x.id===S.sponsor.id);S.sponsor=null;log('info','Ended the sponsorship with '+(sp?sp.n:'your sponsor')+'.');toast('Sponsorship ended.')},
  facup:d=>{const f=FACI[d.f];if(!f)return;const lv=L(f.id),nx=f.lv[lv+1];if(!nx)return;if(S.money<nx.c)return toast('Not enough money.');
    S.money-=nx.c;pxp('ranch',4);pxp('biz',2);S.fac[f.id]=lv+1;if(f.id==='barn')S.stalls=Math.max(S.stalls,STALLS[lv+1]);
    if(f.id==='feedbarn')S.hayPrice=Math.max(3,Math.round(S.hayPrice*[1,.85,.75][lv+1]/[1,.85,.75][lv]));
    log('good',(lv?'Upgraded the '+f.n+' to ':'Built: ')+nx.n+' for '+money(nx.c)+'.');toast(nx.n+(f.g==='stock'?' added!':' is ready!'));
    if(facLevels()>=15)unlock('builder');if(L('house')>=3)unlock('lodge');if(['chickens','goats','sheep','cattle','bees'].every(x=>L(x)))unlock('stockman')},
  facjump:d=>{const el=document.getElementById('fac-'+d.f);if(el){el.scrollIntoView({behavior:'smooth',block:'center'});el.classList.add('flash');setTimeout(()=>el.classList.remove('flash'),1400)}return 'skip'},
  wskip:()=>{skipWatch();return 'skip'},
  wspeed:(d,b)=>{if(WATCH){WATCH.speed=WATCH.speed>=4?1:WATCH.speed*2;PREF.speed=WATCH.speed;savePref();hoovesRate(WATCH.speed);b.textContent='Speed: '+WATCH.speed+'×'}return 'skip'},
  newgame:()=>{UI.modal={type:'confirmNew'}},
  newgameyes:()=>{startNewLife()},
};
(function(){const money=['buy','sell','buyitem','hay','hire','accept','sellitem','studyes','loanpay','borrow','acceptclient','takesponsor'],build=['upgrade','stalls','facup'],groomy=['groom','groomall'];
  const wrap=(k,fn)=>{const f=ACT[k];if(!f)return;ACT[k]=(d,b)=>{const m0=S&&S.money,f0=S&&S.stats&&S.stats.foals,sh0=S&&S.horses.filter(h=>h.shiny).length;const r=f(d,b);try{fn(m0,f0,sh0)}catch(e){}return r}};
  money.forEach(k=>wrap(k,m0=>{if(S&&S.money!==m0)sfx('coin')}));build.forEach(k=>wrap(k,m0=>{if(S&&S.money!==m0)sfx('build')}));groomy.forEach(k=>wrap(k,()=>sfx('groom')));
  wrap('crate',m0=>{if(S&&S.money!==m0)sfx('sparkle')});
  wrap('endday',(m0,f0,sh0)=>{sfx('morning');if(S&&S.stats&&S.stats.foals>f0)setTimeout(()=>sfx('whinny'),700);if(S&&S.horses.filter(h=>h.shiny).length>sh0)setTimeout(()=>sfx('sparkle'),1400)});
  ACT.mute=()=>{PREF.mute=!PREF.mute;savePref();toast(PREF.mute?'Sound off.':'Sound on.')};})();
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');
  if(e.target.closest('select,input,textarea,label'))return;
  if(!b){if(e.target.id==='overlay'&&!(UI.modal&&UI.modal.lock)){UI.modal=null;render()}return}
  const f=ACT[b.dataset.a];if(!f)return;
  e.stopPropagation();
  const r=f(b.dataset,b);
  if(r&&typeof r.then==='function')return;
  if(r!=='skip'){if(S&&UI.screen!=='title')checkAch();save();render()}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&UI.modal&&UI.modal.type==='watch'){skipWatch();return}
  if(e.key==='Escape'&&UI.modal){if(UI.modal.lock)return;UI.modal=null;render();return}
  if((e.key==='ArrowLeft'||e.key==='ArrowRight')&&UI.modal&&UI.modal.type==='horse'&&!(e.target.closest&&e.target.closest('input,textarea,select'))){e.preventDefault();navHorse(e.key==='ArrowLeft'?-1:1);save();render();return}
  if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('horse')){e.preventDefault();e.target.click()}
});
document.addEventListener('change',e=>{
  const c=e.target.dataset&&e.target.dataset.c;if(!c)return;
  if(c==='wpref'){PREF.watch=e.target.checked?0:1;savePref();return}
  if(c==='watchon'){PREF.watch=e.target.checked?1:0;savePref();return}
  if(c==='job'){const h=H(e.target.dataset.id);if(h&&e.target.value)doJob(h,e.target.value);checkAch();save();render();return}
  if(c==='feeddays'){S.feedDays=+e.target.value;save();render();return}
  if(c==='tplan'){const h=H(e.target.dataset.id);if(h){h.tplan=h.tplan||{pri:'normal',stats:{}};h.tplan.stats=h.tplan.stats||{};const f=e.target.dataset.f;if(f==='pri')h.tplan.pri=e.target.value;else h.tplan.stats[f.slice(2)]=e.target.value}save();render();return}
  if(c==='awayh'){UI.awayH=e.target.value;render();return}
  if(c==='awayd'){UI.awayD=e.target.value;render();return}
  if(c==='pname'){UI.pdraft.name=e.target.value;return}
  if(c==='rname'){UI.rname=e.target.value;return}
  if(c==='equip'){if(e.target.value)equip(e.target.value,e.target.dataset.id);save();render();return}
  if(c==='equipto'){if(e.target.value)equip(e.target.dataset.u,e.target.value);save();render();return}
  if(c==='loadfile'){const f=e.target.files&&e.target.files[0];if(!f)return;const rd=new FileReader();
    rd.onload=async()=>{try{const x=await readCode(String(rd.result).trim());loadState(x,'Loaded '+x.ranchName+', day '+x.day+'.');render()}catch(err){toast('That file isn’t a Bloodline Ranch save.')}};
    rd.readAsText(f);return}
  if(c==='mare')UI.breedMare=e.target.value;
  if(c==='sire')UI.breedSire=e.target.value;
  if(c==='comp')UI.compHorse=e.target.value;
  render();
});

/* ---------- boot ---------- */
function defaultDraft(){return {name:'',bg:'farm',look:{skin:ri(0,4),hair:ri(0,3),hairC:ri(0,5),hat:0,hatC:ri(0,4),shirt:ri(0,5),beard:0}}}
function startNewLife(){tutNewGame();UI={tab:'stable',modal:{type:'creator',lock:1,mode:'new'},breedMare:'',breedSire:'',compHorse:'',pdraft:defaultDraft()};save()}
function start(data){
  if(data&&data.S){S=migrate(data.S);UI=data.UI||UI;if(UI.screen!=='title')enterGame()}
  else{S=load();UI.screen='title';UI.tview='main'}
  if(!UI.pdraft)UI.pdraft=defaultDraft();
  if(S&&lastSaveAt===0){save()}
  render();
}
window.claude?.hot?.snapshot?.(()=>({S,UI}));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
