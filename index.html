<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head><body>
<title>Bloodline Ranch</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rye&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: stud-book ledger. Ranch header strip, tab rail, card grid of horses; horse papers open in an overlay. */
:root{
  --paper:#E8ECE2; --card:#F8F9F4; --ink:#1D2520; --muted:#5B685E; --line:#CAD2C3;
  --accent:#2B4A8B; --accent-ink:#FFFFFF; --accent-soft:#DCE3F2;
  --brass:#8E651C; --pasture:#D3DDC6; --pasture2:#BFCCAF; --ground:rgba(40,52,38,.18);
  --good:#2D7643; --warn:#A06A12; --bad:#AA3727; --track:#DDE2D6; --potential:#B9C6D9;
  --shadow:0 1px 2px rgba(29,37,32,.07),0 8px 22px rgba(29,37,32,.06);
  --f-display:'Rye',Georgia,'Times New Roman',serif;
  --f-body:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Consolas,'Courier New',monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#111612; --card:#19201B; --ink:#E4E9DE; --muted:#95A296; --line:#2C362E;
  --accent:#88A5E6; --accent-ink:#0E1420; --accent-soft:#232E44;
  --brass:#D6AC56; --pasture:#1E2920; --pasture2:#263428; --ground:rgba(0,0,0,.35);
  --good:#6CC488; --warn:#E3B05A; --bad:#EF7E69; --track:#252E27; --potential:#34425C;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#111612; --card:#19201B; --ink:#E4E9DE; --muted:#95A296; --line:#2C362E;
  --accent:#88A5E6; --accent-ink:#0E1420; --accent-soft:#232E44;
  --brass:#D6AC56; --pasture:#1E2920; --pasture2:#263428; --ground:rgba(0,0,0,.35);
  --good:#6CC488; --warn:#E3B05A; --bad:#EF7E69; --track:#252E27; --potential:#34425C;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}

:root{--r-common:#6B776D;--r-uncommon:#2E8B4E;--r-rare:#2F68C8;--r-epic:#8440C9;--r-legendary:#BF7A0C;--r-mythical:#0E9C93;--r-mythical2:#B03FC4}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--r-common:#9AA69B;--r-uncommon:#5FCB86;--r-rare:#72A2F2;--r-epic:#BA8BF2;--r-legendary:#F0B54C;--r-mythical:#4FE0D2;--r-mythical2:#E08BF2}}
:root[data-theme="dark"]{--r-common:#9AA69B;--r-uncommon:#5FCB86;--r-rare:#72A2F2;--r-epic:#BA8BF2;--r-legendary:#F0B54C;--r-mythical:#4FE0D2;--r-mythical2:#E08BF2}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 60px}
.wrap{max-width:1180px;margin:0 auto}
h1,h2,h3{margin:0;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:14px 24px;padding-block:18px 14px;border-bottom:2px solid var(--ink)}
.brand{display:flex;flex-direction:column;gap:2px;min-width:0}
.brand h1{font-family:var(--f-display);font-weight:400;font-size:clamp(26px,4vw,36px);letter-spacing:.5px;line-height:1}
.brand .date{color:var(--muted);font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.ledger{display:flex;flex-wrap:wrap;gap:6px 22px;margin-left:auto;align-items:center}
.ledger .item{display:flex;flex-direction:column}
.ledger .k{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.ledger .v{font-family:var(--f-mono);font-size:17px;font-weight:500}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 12px;font-weight:600;font-size:14px;line-height:1.2}
.btn:hover:not(:disabled){border-color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover:not(:disabled){filter:brightness(1.08)}
.btn.end{font-size:15px;padding:10px 18px;letter-spacing:.02em}
.btn.small{padding:4px 8px;font-size:12.5px;border-radius:6px}
.btn.danger{color:var(--bad)}
.btn.armed{background:var(--bad);color:#fff;border-color:var(--bad)}

/* tabs */
.tabs{display:flex;gap:4px;overflow-x:auto;padding-block:10px 0;border-bottom:1px solid var(--line);scrollbar-width:none}
.tab{border:0;background:none;padding:10px 14px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--brass)}
.tab .count{font-family:var(--f-mono);font-size:12px;color:var(--muted);margin-left:4px}
main{padding-block:20px}

.hint{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--accent-soft);border-radius:10px;padding:12px 14px;margin-bottom:18px}
.hint b{color:var(--accent)}
.hint .grow{flex:1;min-width:200px}
.section-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:6px 0 14px}
.section-head h2{font-family:var(--f-display);font-weight:400;font-size:22px}
.section-head .sub{color:var(--muted);font-size:13.5px}
.section-head .right{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}

/* horse cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.horse{background:var(--card);border-radius:12px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;cursor:pointer;border:1px solid transparent}
.horse:hover{border-color:var(--line)}
.portrait{position:relative;background:linear-gradient(180deg,var(--pasture) 0 72%,var(--pasture2) 72% 100%);aspect-ratio:200/120;max-width:100%}
.portrait svg{width:100%;height:100%;display:block}
.pill{position:absolute;top:8px;left:8px;font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:3px 8px;border-radius:99px;background:var(--card);color:var(--ink)}
.pill.ready{color:var(--good)} .pill.tired{color:var(--warn)} .pill.bad{color:var(--bad)} .pill.done{color:var(--muted)} .pill.preg{color:var(--accent)}
.tag-gen{position:absolute;top:8px;right:8px;font-family:var(--f-mono);font-size:11px;padding:3px 7px;border-radius:99px;background:var(--card);color:var(--brass)}
.hbody{padding:12px 14px 14px;display:flex;flex-direction:column;gap:9px;flex:1}
.hname{display:flex;align-items:baseline;gap:8px;min-width:0}
.hname h3{font-size:18px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sexl{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap}
.meta{font-size:12px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.youbtn{border:0;background:none;padding:0;cursor:pointer;border-radius:50%;line-height:0}.youbtn svg{border-radius:50%;box-shadow:0 0 0 2px var(--line)}
.creator{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start}.pcprev{flex:none}.pcform{flex:1;min-width:240px}
.pcrow{display:flex;align-items:center;gap:10px;margin:6px 0;flex-wrap:wrap}.pclbl{width:76px;font-size:12.5px;color:var(--muted)}.pcopts{display:flex;gap:5px;flex-wrap:wrap}
.pcopt{min-width:28px;height:28px;border-radius:8px;border:1.5px solid var(--line);background:var(--paper);font-size:12px;padding:0 8px;cursor:pointer;color:var(--ink);text-transform:capitalize}.pcopt.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.bggrid,.giftgrid,.pathgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.bgcard{text-align:left;display:flex;flex-direction:column;gap:3px;padding:10px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper);cursor:pointer;color:var(--ink);font:inherit}.bgcard.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.giftcard,.pathcard{display:flex;flex-direction:column;gap:6px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--paper)}.pathcard ul{padding-left:18px;margin:4px 0}.pathcard .btn{margin-top:auto}
.tutbanner{margin-bottom:16px;border:1.5px solid var(--accent)}.tuthead{display:flex;gap:12px;align-items:flex-start}.tuthead svg{flex:none;border-radius:50%}
.tutlist{list-style:none;padding:0;margin:10px 0;display:grid;gap:4px}.tutlist li.done{color:var(--good,#2d7a3e)}.tutlist li.next{font-weight:700}
.profile{margin-bottom:16px}.pfhead{display:flex;gap:14px;align-items:center;margin-bottom:10px}.pfhead svg{border-radius:50%}
.pskills{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px 18px}
.loanrow{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid var(--line)}
.chip.warn{border-color:#C98A1B;color:#9a6512}
.chip.trainchip{border-color:var(--r-rare,#2f6fd6);color:var(--r-rare,#2f6fd6);font-weight:600}
.pastbanner{padding:8px 12px;border-radius:8px;margin-bottom:12px;background:color-mix(in srgb,var(--brass,#9a6b1f) 14%,transparent);border-left:4px solid var(--brass,#9a6b1f)}.pastbanner.died{background:color-mix(in srgb,#6b6b6b 14%,transparent);border-left-color:#6b6b6b}
.linkbtn{background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.specline{color:var(--ink)}.specline b{color:var(--brass,#9a6b1f)}
.ctrgrid,.clientgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}.clientgrid{margin-top:12px}.ctr.r-high{border:1.5px solid var(--r-legendary)}.ctr.r-mid{border:1.5px solid var(--r-rare)}.awayrow{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line,#ddd)}.awayrow:last-child{border-bottom:0}
.inbox{border-left:4px solid var(--line,#ccc);padding:6px 10px;margin:8px 0;border-radius:6px;background:color-mix(in srgb,var(--card) 80%,transparent)}.inbox.bad,.inbox.warn,.inbox.good{color:var(--ink)}.inbox.bad{border-color:#B4412F}.inbox.warn{border-color:#C98A1B}.inbox.good{border-color:#3C7A3E}
.bloodline{font-size:12px;margin:3px 0 2px;color:var(--ink)}.pedblood{opacity:.85}
.chip{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:99px;border:1px solid var(--line);white-space:nowrap}
.chip.good{color:var(--good);border-color:color-mix(in srgb,var(--good) 40%,transparent)}
.chip.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.chip.learned{color:var(--accent);border-style:dashed;border-color:var(--accent)}
.chip.rare{color:var(--brass);border-color:color-mix(in srgb,var(--brass) 50%,transparent)}
.bars{display:grid;grid-template-columns:34px 1fr 52px;gap:4px 8px;align-items:center;font-size:11.5px}
.bars .lab{font-weight:700;letter-spacing:.06em;color:var(--muted)}
.bars .val{font-family:var(--f-mono);text-align:right;font-size:11.5px;color:var(--muted)}
.bars .val b{color:var(--ink);font-weight:500}
.bar{position:relative;height:8px;background:var(--track);border-radius:4px;overflow:hidden}
.bar .pot{position:absolute;inset:0 auto 0 0;background:var(--potential);border-radius:4px}
.bar .tr{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:4px}
.vitals{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;font-size:10.5px;color:var(--muted)}
.vital{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vital .m{height:4px;background:var(--track);border-radius:2px;margin-top:3px;overflow:hidden}
.vital .m i{display:block;height:100%;border-radius:2px}
.actions{display:flex;flex-wrap:wrap;gap:5px;margin-top:auto;padding-top:4px}
.actions .lbl{font-size:11px;color:var(--muted);align-self:center;margin-right:2px;letter-spacing:.06em;text-transform:uppercase;font-weight:700}

/* panels */
.panel{background:var(--card);border-radius:12px;box-shadow:var(--shadow);padding:16px 18px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;align-items:start}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
select,input[type=text]{font:inherit;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 10px;max-width:100%}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;font-weight:700;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
td.n,th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto}
.empty{color:var(--muted);padding:22px;text-align:center;border:1px dashed var(--line);border-radius:12px}
.note{font-size:13px;color:var(--muted)}
.good{color:var(--good)} .bad{color:var(--bad)} .warn{color:var(--warn)}
.offer{display:flex;flex-wrap:wrap;gap:10px;align-items:center;border:1px solid var(--brass);border-radius:10px;padding:10px 14px;margin-bottom:12px;background:var(--card)}
.offer .grow{flex:1;min-width:180px}

/* compete grid */
.events{display:grid;gap:14px}
.event{background:var(--card);border-radius:12px;box-shadow:var(--shadow);padding:14px 16px;display:grid;grid-template-columns:minmax(180px,1fr) 3fr;gap:14px;align-items:center}
.tabban{height:clamp(64px,9vw,108px);border-radius:12px;overflow:hidden;margin:0 0 14px;box-shadow:var(--shadow);line-height:0}.tabban svg{width:100%;height:100%;display:block}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tabban,:root:not([data-theme="light"]) .evart,:root:not([data-theme="light"]) .shopart{filter:brightness(.88)}}:root[data-theme="dark"] .tabban,:root[data-theme="dark"] .evart,:root[data-theme="dark"] .shopart{filter:brightness(.88)}
.titlemode .top,.titlemode #tabs{display:none}
.title{max-width:880px;margin:10px auto 30px;display:flex;flex-direction:column;align-items:stretch}
.titleart{border-radius:16px;overflow:hidden;box-shadow:var(--shadow);aspect-ratio:1000/300;min-height:180px;line-height:0}.titleart svg{width:100%;height:100%;display:block}
.tsub{text-align:center;font-family:Rye,Georgia,serif;font-size:17px;color:var(--muted);margin:14px 0 10px}
.tmenu{display:grid;gap:10px;max-width:460px;width:100%;margin:6px auto 0}
.tbtn{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:14px 18px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;box-shadow:var(--shadow);font:inherit}
.tbtn:hover{border-color:var(--accent)}.tbtn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.tbtn.primary .tb2{color:rgba(255,255,255,.85)}
.tb1{font-size:18px;font-weight:700}.tb2{font-size:13px;color:var(--muted)}
.tpanel{max-width:640px;width:100%;margin:6px auto 0}.tpanel h2{margin:0 0 10px}
.tbuild{text-align:center;margin-top:16px}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--line)}.setrow>div:first-child{flex:1;min-width:200px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.shinyfx{position:absolute;inset:0;pointer-events:none;border-radius:inherit;box-shadow:inset 0 0 0 2.5px #F2C94C,inset 0 0 0 4px rgba(255,255,255,.55),inset 0 0 22px rgba(255,214,102,.55)}
.shinyfx i{position:absolute;width:14px;height:14px;clip-path:polygon(50% 0,60% 40%,100% 50%,60% 60%,50% 100%,40% 60%,0 50%,40% 40%);background:#FFF3B0;filter:drop-shadow(0 0 3px #FFD45C);animation:twinkle 2.4s ease-in-out infinite}
.shinyfx i:nth-child(1){left:6px;top:6px}.shinyfx i:nth-child(2){right:8px;top:10px;animation-delay:.4s;width:10px;height:10px}.shinyfx i:nth-child(3){left:10px;bottom:10px;animation-delay:.9s;width:10px;height:10px}.shinyfx i:nth-child(4){right:6px;bottom:6px;animation-delay:1.3s}.shinyfx i:nth-child(5){left:48%;top:4px;animation-delay:1.7s;width:8px;height:8px}.shinyfx i:nth-child(6){left:30%;bottom:5px;animation-delay:2s;width:8px;height:8px}
@keyframes twinkle{0%,100%{opacity:.25;transform:scale(.6) rotate(0)}50%{opacity:1;transform:scale(1.1) rotate(20deg)}}@media (prefers-reduced-motion:reduce){.shinyfx i{animation:none;opacity:.9}}
.shinytag{display:inline-flex;align-items:center;font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:999px;color:#5a4300;background:linear-gradient(90deg,#FFE27A,#FFF4C2,#F2C94C);box-shadow:0 0 0 1px #D9A92A inset;white-space:nowrap}
.event h3{font-size:16px}.evart{border-radius:10px;overflow:hidden;margin-bottom:10px;line-height:0;aspect-ratio:240/110;max-width:320px}.evart svg{width:100%;height:100%;display:block}
.event .w{font-size:12px;color:var(--muted);margin-top:3px}
.tiers{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tierbtn{text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:9px 11px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tierbtn:hover:not(:disabled){border-color:var(--accent)}
.tierbtn:disabled{opacity:.5;cursor:not-allowed}
.tierbtn.closed{border-style:dashed}
.btn.groomplus{border-color:var(--brass,#9a6b1f);color:var(--brass,#9a6b1f)}
.showcal{margin-bottom:16px}.calgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:6px 18px}.calrow{display:flex;flex-direction:column;padding:6px 0;border-bottom:1px solid var(--line)}.calrow.open b{color:var(--good,#2d7a3e)}
.tierbtn .t{font-weight:700;font-size:13.5px}
.tierbtn .s{font-size:11.5px;color:var(--muted);font-family:var(--f-mono)}
.tierbtn .o{font-size:12px;font-weight:700}
@media (max-width:680px){.event{grid-template-columns:1fr}.tiers{grid-template-columns:1fr}}

/* overlay */
.overlay{position:fixed;inset:0;background:rgba(10,14,11,.55);display:flex;align-items:flex-start;justify-content:center;z-index:50;overflow-y:auto;
  padding:max(24px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.modal.watch{width:min(900px,100%)}
.wstage{border-radius:10px;overflow:hidden;background:#9CBF79;line-height:0}.wstage svg{width:100%;height:auto;display:block}
.wcomm{margin:10px 0;padding:10px 14px;border-radius:10px;background:var(--paper);font-weight:600;font-size:16px;min-height:22px}
.wbottom{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start}.wctl{display:flex;flex-direction:column;gap:8px;min-width:190px}
.wboard{list-style:none;margin:0;padding:0;flex:1;min-width:240px;display:flex;flex-direction:column;gap:3px}
.wboard li{display:flex;gap:8px;align-items:center;padding:4px 8px;border-radius:6px;font-size:14px;transition:background .3s}.wboard li.me{background:rgba(226,176,7,.18);font-weight:700}
.wboard .silk{width:10px;height:10px;border-radius:50%;background:var(--silk);flex:none}.wboard .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.wboard .val{font-family:ui-monospace,monospace}
.modal{background:var(--card);color:var(--ink);border-radius:14px;width:min(860px,100%);box-shadow:0 20px 60px rgba(0,0,0,.35);position:relative;overflow:hidden}
.modal .mhead{display:flex;gap:10px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}

function bestEventOf(h){let bi=0,bv=-1;EVENTS.forEach((ev,i)=>{let v=0;for(const k in ev.w)v+=ev.w[k]*(h.tr[k]+h.pot[k])/2;if(v>bv){bv=v;bi=i}});return bi}
function gearRole(h){if(h.retired)return 'retired';if(!isAdult(h))return 'young';return 'active'}
function itemScore(it,h){const e=it.e,role=gearRole(h),be=EVENTS[bestEventOf(h)].id;let v=0;
  const compW=role==='active'?1:0,trainW=role==='retired'?0:(avg(h.tr)/Math.max(1,avg(h.pot))<.8?1.5:.8);
  v+=(e.comp||0)*3*compW;if(e.ev)for(const k in e.ev)v+=e.ev[k]*(k===be?3:.4)*compW;
  v+=(e.train||0)*1.5*trainW;
  if(e.inj)v+=(1-e.inj)*100*.8*(has(h,'fragile')?1.6:1)*(role==='retired'?.3:1);
  v+=(e.happy||0)*4*(has(h,'skittish')?1.4:1)+(e.energy||0)*1.5+(e.health||0)*2+(e.bond||0)*2.5+(e.rep||0)*4*compW;
  return v+RORDER.indexOf(it.r)*.01}
function horsePrio(h){return (gearRole(h)==='active'?2:gearRole(h)==='young'?1.3:1)*(1+avg(h.pot)/100)}
function autoEquip(onlyH){let n=0;const hs=(onlyH?[onlyH]:S.horses.filter(h=>!h.client)).sort((a,b)=>horsePrio(b)-horsePrio(a));
  for(const h of hs)for(const sl of SLOTS){if(S.inv.some(y=>y.on===h.id&&ITEMS[y.id].s===sl.k))continue;
    const c=S.inv.filter(y=>y.on==null&&ITEMS[y.id].s===sl.k).sort((a,b)=>itemScore(ITEMS[b.id],h)-itemScore(ITEMS[a.id],h))[0];if(c){c.on=h.id;n++}}
  return n}
function optimizeGear(onlyH){let moved=0;const before={};for(const x of S.inv)before[x.uid]=x.on;
  if(onlyH){for(const sl of SLOTS){const cur=S.inv.find(y=>y.on===onlyH.id&&ITEMS[y.id].s===sl.k);
      const pool=S.inv.filter(y=>ITEMS[y.id].s===sl.k).sort((a,b)=>itemScore(ITEMS[b.id],onlyH)-itemScore(ITEMS[a.id],onlyH));const best=pool[0];
      if(best&&best!==cur&&(!cur||itemScore(ITEMS[best.id],onlyH)>itemScore(ITEMS[cur.id],onlyH))){const prev=best.on;if(cur)cur.on=prev??null;best.on=onlyH.id}}}
  else{for(const sl of SLOTS){const items=S.inv.filter(y=>ITEMS[y.id].s===sl.k);if(!items.length)continue;for(const y of items)y.on=null;
      const pairs=[];for(const h of S.horses.filter(h=>!h.client))for(const y of items)pairs.push([itemScore(ITEMS[y.id],h)*horsePrio(h),h,y]);pairs.sort((a,b)=>b[0]-a[0]);
      const usedH=new Set();for(const [sc,h,y] of pairs){if(y.on!=null||usedH.has(h.id)||sc<=0)continue;y.on=h.id;usedH.add(h.id)}}}
  for(const x of S.inv)if(before[x.uid]!==x.on)moved++;return moved}

function workDone(h,k,w=1){h.jobs=(h.jobs||[]).filter(j=>j.d>S.day-7);let n=jobCount(h,k);if(has(h,'easilybored'))n*=2;const kinds=new Set(recentJobs(h).map(j=>j.k));h.jobs.push({d:S.day,k,w});

  dh=Math.round(dh*10)/10;h.happy=clamp(h.happy+dh,0,100);h.lastMood={d:S.day,dh,t:notes.join(', ')};
  return dh?` (${notes.join(', ')}: happiness ${dh>0?'+':''}${Math.round(dh)})`:''}

  else{let x=a,y=b;if(regGen(x,memo)<regGen(y,memo)){x=b;y=a}const r=S.registry[x];v=r?.5*(kinship(r.sire,y,memo,d+1)+kinship(r.dam,y,memo,d+1)):0}

function value(h){

function status(h){

  if(h.pastured===S.day&&!h.preg)return ['ready','In pasture'];
  if(h.preg&&!pregLight(h))return ['preg','In foal · due '+Math.max(0,h.preg.due-S.day)+'d'];
  if(h.preg&&h.acted===S.day&&h.pastured!==S.day)return ['done','In foal · done today'];
  if(h.preg&&h.pastured===S.day)return ['preg','In foal · in pasture'];
  if(h.preg&&h.energy>=25)return ['preg','In foal · light work ok'];
  if(stage(h)==='Foal')return ['done','Foal · growing'];
  if(h.acted===S.day)return ['done','Done today'];
  if(h.energy<25)return ['tired','Tired'];

function compMult(h,ev){

/* ---------- breeding ---------- */
function eligibleMares(){return S.horses.filter(h=>!h.client&&h.sex==='F'&&isAdult(h)&&!h.preg&&!h.injury&&h.acted!==S.day)}

function isRetry(s){return !!(S.studRetry&&S.studRetry.stud===s.id)}
function studPrice(s){return isRetry(s)?Math.round(s.fee/2/10)*10:s.fee}
function feeLabel(s){return isRetry(s)?money(studPrice(s))+' (half-price retry, normally '+money(s.fee)+')':money(s.fee)}
function resolveSire(v){if(!v)return null;const[t,id]=v.split(':');if(t==='h')return {h:H(id),fee:0};const s=S.studs.find(x=>x.id===+id);return s?{h:s,fee:studPrice(s),stud:1,retry:isRetry(s)}:null}
function conception(m,s){let c=.65*fertOf(m)*(1+(fertOf(s)-1)*.5)+(specOf('vet')==='repro'?.08:0);if(has(m,'fertile'))c+=.2;if(has(s,'fertile'))c+=.1;if(has(m,'shybreeder'))c-=.3;if(has(s,'shybreeder'))c-=.3;c*=.6+.4*m.health/100;c*=.8+.4*m.happy/100;if(age(m)>=20*DPY)c-=.25;c+=[0,.08,.15][L('foaling')];return clamp(c,.05,.95)}
function pregnancies(){return S.horses.filter(h=>h.preg).length}
function breed(){
  const m=H(UI.breedMare),sr=resolveSire(UI.breedSire);
  if(!m||!sr||!sr.h)return toast('Pick a mare and a stallion first.');
  const s=sr.h;
  if(!eligibleMares().includes(m))return toast(m.name+' can’t be bred today.');
  if(!sr.stud&&!eligibleSires().includes(s))return toast(s.name+' can’t breed today.');
  if(S.horses.length+pregnancies()>=S.stalls)return toast('No room for a foal. Build more stalls first.');
  if(S.money<sr.fee)return toast('Not enough money for the stud fee.');
  if(m.health<50)return toast(m.name+' needs at least 50 health to carry a foal.');
  S.money-=sr.fee;m.acted=S.day;if(!sr.stud)s.acted=S.day;pxp('eye',4);

  if(R()<c){m.preg={due:S.day+GEST,sire:sireSnap(s),twins:has(m,'fertile')&&R()<.12};
    log('good',m.name+' is in foal to '+s.name+'. Due in '+GEST+' days.');toast('It took! '+m.name+' is in foal.')}
  else{let extra='';

/* ================= BANK ================= */
function bankInit(s){if(!s.bank)s.bank={loans:[],credit:680,ledger:[],autopay:1,bailout:0,missed:0,season:{start:s.money||0,pay:0,borrow:0},last:null,nextLoanId:1}}
function loanPayment(P,rate,n){const r=rate/4;return Math.round(P*r/(1-Math.pow(1+r,-n)))}
function addLoan(name,amt,rate,n,grace,initial){const b=S.bank;const l={id:b.nextLoanId++,name,orig:amt,bal:amt,rate,n,pay:loanPayment(amt,rate,n),next:S.day+(grace||4),due:0,start:S.day,initial:!!initial};b.loans.push(l);
  bankLog(initial?'Took on '+name:'New loan: '+name,amt,'loan');if(!initial){S.money+=amt;b.season.borrow+=amt}return l}
function bankLog(t,amt,k){S.bank.ledger.unshift({d:S.day,t,amt,k});if(S.bank.ledger.length>80)S.bank.ledger.length=80}
function totalDebt(){return Math.round((S.bank?S.bank.loans:[]).reduce((a,l)=>a+l.bal,0))}
function totalDue(){return (S.bank?S.bank.loans:[]).reduce((a,l)=>a+l.due,0)}
function creditBand(c){return c>=760?['Excellent','good']:c>=700?['Good','good']:c>=640?['Fair','']:c>=580?['Poor','warn']:['Bad','bad']}
function loanOffer(){const c=S.bank.credit;if(S.phase!=='play')return null;const cap=c>=760?30000:c>=700?15000:c>=640?8000:c>=600?4000:0;const room=Math.max(0,60000-totalDebt());const max=Math.min(cap,room);if(max<1000)return null;
  const rate=Math.max(.03,.05+Math.max(0,760-c)/40*.01-(psk('biz')-1)*.004);return {max,rate}}
function payLoan(l,amt,why){amt=Math.min(amt,Math.ceil(l.bal),S.money);if(amt<=0)return 0;S.money-=amt;l.bal=Math.max(0,l.bal-amt);l.due=Math.max(0,l.due-amt);S.bank.season.pay+=amt;bankLog(why||('Payment: '+l.name),-amt,'pay');
  if(l.bal<=.5){S.bank.loans=S.bank.loans.filter(x=>x!==l);const ot=l.ontime||0,bonus=ot>=3?30:ot*8;S.bank.credit=Math.min(850,S.bank.credit+bonus);bankLog(l.name+' paid off!',0,'paid');log('good','You paid off the '+l.name+'!'+(bonus?' Credit score +'+bonus+'.':' No credit boost: the bank only rewards a record of on-time seasonal payments.'));if(ot>=1)unlock('debtfree')}
  if(totalDue()<=0)S.bank.missed=0;pxp('biz',1);return amt}
function bankSeason(ev){const b=S.bank;if(!b)return;b.last={...b.season,end:S.money,ops:(S.money-b.season.start)+b.season.pay-b.season.borrow};b.season={start:S.money,pay:0,borrow:0};
  let posted=false;for(const l of b.loans){if(l.next>S.day)continue;posted=true;if(l.billed&&l.due<=0)l.ontime=(l.ontime||0)+1;l.billed=(l.billed||0)+1;const intr=Math.round(l.bal*l.rate/4);l.bal+=intr;l.due+=Math.min(l.pay,Math.ceil(l.bal));l.next=S.day+4;l.n=Math.max(1,l.n-1);bankLog('Interest on '+l.name,intr,'int')}
  if(!posted&&!totalDue())return;
  if(b.autopay)for(const l of b.loans)if(l.due>0&&S.money>=l.due){const a=l.due;payLoan(l,a,'Seasonal payment: '+l.name);ev.push(['info','Paid '+money(a)+' on your '+l.name+'.'])}

/* ---------- rendering ---------- */
function traitChips(h){return (h.coi>=.0625?'<span class="chip bad" title="Inbred: parents were close relatives.">Inbred '+pctTxt(h.coi)+'</span>':'')+(h.vigor?'<span class="chip good" title="Hybrid vigor: first cross of two purebreds. +2 potential and fewer injuries.">Hybrid vigor</span>':'')+h.traits.map(t=>{const T=TRAITS[t];return `<span class="chip ${T.rare?'rare':T.good?'good':'bad'}" title="Natural skill: ${esc(T.d)}">${T.n}</span>`}).join('')+(h.skills||[]).map(k=>`<span class="chip learned" title="Learned skill: ${esc(SKILLS[k].d)}">${SKILLS[k].n}</span>`).join('')}
function statBars(h){return STATS.map(s=>`<span class="lab">${s.s}</span><span class="bar"><span class="pot" style="width:${h.pot[s.k]}%"></span><span class="tr" style="width:${h.tr[s.k]}%"></span></span><span class="val"><b>${Math.floor(h.tr[s.k])}</b>/${h.pot[s.k]}</span>`).join('')}
function vit(lbl,v,col){return `<div class="vital">${lbl} <span class="num">${Math.round(v)}</span><div class="m"><i style="width:${v}%;background:${col}"></i></div></div>`}
function vitColor(v){return v>=60?'var(--good)':v>=30?'var(--warn)':'var(--bad)'}

function horseCard(h,mode){
  const [sc,sl]=mode==='market'?['ready',money(h.price)]:status(h);
  const c=coat(h.genes);
  let actions='';
  if(mode==='market'){actions=`<button class="btn primary small" data-a="buy" data-i="${S.market.indexOf(h)}">Buy for ${money(h.price)}</button><button class="btn small" data-a="open" data-id="${h.id}" data-m="market">View papers</button>`}
  else{
    const w=canWork(h)&&h.energy>=25;
    actions=groomBtn(h,true);
    if(canTurnout(h))actions+=`<button class="btn small" data-a="rest" data-id="${h.id}" title="Turn out to pasture">Pasture</button>`;
    if(stage(h)!=='Foal'&&pregOk(h)){actions+=`<span class="lbl">Train</span>`+STATS.map(s=>`<button class="btn small" data-a="train" data-id="${h.id}" data-k="${s.k}" ${w&&h.tr[s.k]<h.pot[s.k]?'':'disabled'} title="Train ${s.n}">${s.s}</button>`).join('')}
    if(canWork(h))actions+=jobSelect(h);
  }
  return `<article class="horse r-${rarityOf(h)}" data-a="open" data-id="${h.id}" ${mode==='market'?'data-m="market"':''} tabindex="0" aria-label="${esc(h.name)}">
  <div class="portrait${h.shiny?' shiny':''}">${horseSVG(h)}${shinyFx(h)}<span class="pill ${sc}">${sl}</span>${h.gen?`<span class="tag-gen">GEN ${h.gen}</span>`:''}</div>
  <div class="hbody">
    <div class="hname"><h3>${esc(h.name)}</h3><span class="sexl">${sexLabel(h)} · ${ageLabel(h)}</span></div>
    <div class="breedline">${rbadge(rarityOf(h))}${shinyTag(h)}<span>${breedLabel(h)}</span>${h.client?`<span class="chip rare">Client · ${h.client.until-S.day}d left</span>`:''}${h.retired?'<span class="chip retired">Retired</span>':''}${mode!=='market'&&gearOf(h).length?`<span class="note" style="font-weight:500">· ${gearOf(h).length} gear</span>`:''}${mode!=='market'&&S.staff.trainer&&tpri(h)!=='normal'&&stage(h)!=='Foal'?`<span class="tchip">· Trainer: ${{high:'High',low:'Low',off:'Off'}[tpri(h)]}</span>`:''}${(h.ribbons||[]).length?`<span class="note ribcount" style="font-weight:500">· ${ribbonSVG(Math.min(...h.ribbons.map(r=>r.p)),Math.max(...h.ribbons.map(r=>r.t)),11)} ${h.ribbons.length} ribbon${h.ribbons.length>1?'s':''}</span>`:''}</div>
    <div class="meta"><span class="mono">${h.reg}</span> · ${c.full}${rareCoat(c)?' ★':''}</div>
    ${mode==='market'?pedChip(h):''}
    ${(mode!=='market'&&trainerTag(h))||moodChip(h)||h.vigor||h.coi>=.0625||h.traits.length||(h.skills||[]).length?`<div class="chips">${mode!=='market'?trainerTag(h)+moodChip(h):''}${traitChips(h)}</div>`:''}
    <div class="bars">${statBars(h)}</div>
    ${mode==='market'?'':`<div class="vitals">${vit('Energy',h.energy,vitColor(h.energy))}${vit('Happy',h.happy,vitColor(h.happy))}${vit('Health',h.health,vitColor(h.health))}${vit('Stall',stallOf(h),vitColor(stallOf(h)))}</div>`}
    <div class="actions">${actions}</div>
  </div></article>`;
}

function hint(){
  if(!S.horses.length)return 'Your barn is empty. Visit the <b>Market</b> to buy a horse.';
  const need=herdHay();
  if(S.hay<need)return 'You don’t have enough hay for tonight. Buy some on the <b>Office</b> tab or your horses will go hungry.';
  {const e=S.horses.find(h=>h.inj&&COND[h.inj.id].emergency&&!h.inj.handled);if(e)return '<b>'+esc(e.name)+' is colicking!</b> Open '+(e.sex==='M'?'his':'her')+' papers and call the emergency vet today.'}
  {const ih=S.horses.find(h=>h.inj&&!h.inj.treated.length);if(ih)return '<b>'+esc(ih.name)+'</b> has '+COND[ih.inj.id].n.toLowerCase()+'. Open '+(ih.sex==='M'?'his':'her')+' papers to choose a treatment, or let rest do its work.'}
  if(S.horses.some(h=>h.groomed!==S.day)||(grooms().length&&S.horses.some(h=>h.bond<40&&h.pgroomed!==S.day)))return grooms().length?'Press <b>Groom +bond</b> on horses you want a closer bond with. <b>'+esc(groomNames())+'</b> brush horses each morning, but your own grooming builds bond faster.':'Start by grooming everyone (or hire a Stable Hand on the Staff tab to do it for you). It keeps them happy, and happy horses train and compete better.';
  const ready=S.horses.filter(h=>canWork(h)&&h.energy>=25);
  if(ready.length){const c=ready.find(canCompete);
    return '<b>'+esc(ready[0].name)+'</b> is ready to work. Click a <b>Train</b> button to raise a stat'+(c?', or head to <b>Compete</b> to win prize money':'')+'. Mares can also be bred on the <b>Breeding</b> tab.'}
  if(S.hay<need*3)return 'Hay is getting low. Stock up on the <b>Office</b> tab before ending the day.';
  if(dirtyStalls(40))return dirtyStalls(40)+' stall'+(dirtyStalls(40)>1?'s are':' is')+' dirty. Pick <b>Muck out the stalls</b> in the Your Day box'+(grooms().length?'. Your stable staff can’t keep up alone.':', or hire a Stable Hand on the Staff tab.');
  if(stockLevels()&&S.stockCare<40)return 'Your livestock need care. Pick <b>Tend to livestock</b>, or hire a Livestock Hand on the Staff tab.';
  if(choresLeft()>0)return 'The horses are done. Pick how <b>you</b> spend the day in the box below, then press <b>End Day</b>.';
  return 'Everyone has worked today. Press <b>End Day</b> to rest the herd overnight.';
}

  const need=herdHay();
  $('#ledger').innerHTML=`${S.player?`<button class="youbtn" data-a="tab" data-t="office" title="${esc(S.player.name)}: your skills">${portraitSVG(S.player.look,38)}</button>`:''}
  <div class="item"><span class="k">Bank</span><span class="v">${money(wm?wm.money:S.money)}</span></div>
  <div class="item"><span class="k">Hay</span><span class="v ${S.hay<need*3?'bad':''}">${S.hay} <small style="font-size:12px;color:var(--muted)">bales</small></span></div>
  <div class="item"><span class="k">Stalls</span><span class="v">${S.horses.length}/${S.stalls}</span></div>
  <div class="item"><span class="k">Reputation</span><span class="v">${wm?wm.rep:S.rep}</span></div>
  <button class="btn" data-a="mute" title="${PREF.mute?'Turn sound on':'Turn sound off'}" aria-label="${PREF.mute?'Turn sound on':'Turn sound off'}">${PREF.mute?'🔇':'🔊'}</button><button class="btn" data-a="menu" title="Start screen: load, new game, settings">Menu</button><button class="btn" data-a="savenow" title="${lastSaveOk?'Autosave is working':'Saving is blocked in this browser'}">${lastSaveOk?'✓ Saved':'⚠ Save'}</button>
  <button class="btn primary end" data-a="endday">End Day →</button>`;
  const tabs=[['stable','Stable',S.horses.length],['breeding','Breeding',pregnancies()||''],['compete','Compete',''],['market','Market',S.market.length],['tack','Tack Shop',S.inv.length||''],['boarding','Boarding',(S.away.length+S.horses.filter(h=>h.client).length+(S.boardReq||[]).length)||''],['facilities','Facilities',facLevels()||''],['bank','Bank',S.bank&&totalDue()?'!':''],['staff','Staff',STAFF.filter(x=>S.staff[x.id]).length||''],['office','Office',''],['hof','Hall of Fame',(S.memorial||[]).length||''],['journal','Journal','']];
  $('#tabs').innerHTML=tabs.map(([k,n,c])=>`<button class="tab" role="tab" aria-selected="${UI.tab===k}" data-a="tab" data-t="${k}">${n}${c!==''?`<span class="count">${c}</span>`:''}</button>`).join('');
}

function renderStable(){
  const offers=S.offers.map(o=>{const h=H(o.id);return h?`<div class="offer"><div class="grow"><b>${esc(o.who)}</b> wants to buy <b>${esc(h.name)}</b> for <b class="mono">${money(o.amt)}</b> <span class="note">(worth about ${money(saleValue(h))}, offer ends day ${o.exp})</span></div><button class="btn primary small" data-a="accept" data-id="${h.id}">Accept</button><button class="btn small" data-a="decline" data-id="${h.id}">Decline</button></div>`:''}).join('');
  const studs=S.studReq.map(r=>{const h=H(r.id);if(!h)return '';const ok=canWork(h)&&h.energy>=20;
    return `<div class="offer"><div class="grow"><b>${esc(r.who)} Ranch</b> wants to breed their mare to <b>${esc(h.name)}</b> ${rbadge(rarityOf(h))} and will pay <b class="mono">${money(r.fee)}</b> <span class="note">(stud service, uses ${esc(h.name)}’s day and 20 energy, offer ends day ${r.exp})</span>${ok?'':'<div class="note bad">'+esc(h.name)+' can’t do it today. Accept tomorrow before the offer ends.</div>'}</div><button class="btn primary small" data-a="studyes" data-id="${h.id}" ${ok?'':'disabled'}>Accept</button><button class="btn small" data-a="studno" data-id="${h.id}">Decline</button></div>`}).join('');
  return `<div class="hint"><div class="grow"><b>Next step:</b> ${hint()}</div></div>${studs}${offers}${yourDay()}
  <div class="section-head"><h2>The Barn</h2><span class="sub">Tonight the herd eats ${herdHay()} bales${stockHay()?' (horses '+Math.round(horseHay()*10)/10+', livestock '+stockHay()+')':''}. Click any horse to see its papers.</span>
  <div class="right"><button class="btn" data-a="groomall" ${S.horses.every(h=>h.pgroomed===S.day)?'disabled':''} title="${grooms().length?esc(groomNames())+' brush horses each morning. Grooming them yourself adds extra bond.':'Groom every horse: happiness and bond up'}">${S.horses.every(h=>h.pgroomed===S.day)?'✓ All groomed':grooms().length?'Groom all yourself (+bond)':'Groom all'}</button><button class="btn" data-a="restall">Turn out the rest</button></div></div>
  ${grooms().length?`<div class="helpline ${groomCap()<S.horses.length?'warn':''}"><span>${groomCap()<S.horses.length?'!':'✓'}</span><span>${groomNote()}</span></div>`:''}
  ${S.horses.length?`<div class="grid">${S.horses.map(h=>horseCard(h)).join('')}</div>`:'<div class="empty">No horses yet. Buy one at the Market.</div>'}`;
}

function yourDay(){
  if(S.choreDay!==S.day){S.choreDay=S.day;S.choresToday=[]}
  const left=choresLeft(),si=dateParts(S.day).sIdx;
  const mt=(lbl,v)=>`<div class="meter">${lbl} <b class="mono">${Math.round(v)}%</b><div class="m"><i style="width:${v}%;background:${vitColor(v)}"></i></div></div>`;
  return `<div class="panel yourday"><div class="yd-head"><b>Your day</b><span class="note">${left?'Pick '+(left===2?'two things':'one more thing')+' to do yourself today.':'You’ve done your two things for today.'}</span></div>
  <div class="meters">${mt('Stalls clean (average)',avgStall())}${dirtyStalls(50)?`<div class="meter"><span class="bad">${dirtyStalls(50)} dirty stall${dirtyStalls(50)>1?'s':''}</span></div>`:''}${stockLevels()?mt('Livestock care',S.stockCare):''}</div>
  <div class="chores">${CHORES.map(c=>{const did=S.choresToday.includes(c.id);const dis=!left||did||(c.id==='cut'&&si===3)||(c.id==='scout'&&S.money<60)||(c.id==='show'&&L('ring')<3)||(c.id==='tend'&&!stockLevels())||(c.id==='staffwork'&&!STAFF.some(x=>S.staff[x.id]));
    let sub=c.d;if(c.id==='cut')sub=si===3?'Nothing grows in winter.':'About '+Math.round([10,12,5][si]*hayMult())+' free bales this '+SEASONS[si].toLowerCase()+'.';
    if(c.id==='muck'){sub=dirtyStalls(50)?'<span class="bad">'+dirtyStalls(50)+' dirty stall'+(dirtyStalls(50)>1?'s':'')+'. Those horses are suffering.</span>':'You clean the dirtiest stalls first. Enough work for about 5 filthy stalls, or many lightly dirty ones.';const n=stallNote();if(n)sub+=`<span class="staffnote ${n.ok?'':'warn'}">${n.ok?'✓ ':''}${n.t}</span>`}
    if(c.id==='tend')sub=!stockLevels()?'No livestock yet.':S.stockCare<50?'<span class="bad">Your animals need you. Income is down.</span>':c.d;if(c.id==='tend'){const n=stockNote();if(n)sub+=`<span class="staffnote ${n.ok?'':'warn'}">${n.ok?'✓ ':''}${n.t}</span>`}
    if(c.id==='staffwork'&&!STAFF.some(x=>S.staff[x.id]))sub='Hire some help first.';
    return `<button class="chore" data-a="chore" data-k="${c.id}" ${dis?'disabled':''}><span class="t">${did?'✓ ':''}${c.n}</span><span class="s">${sub}</span></button>`}).join('')}</div></div>`;
}
function crewCard(x,p){
  let extra='';
  if(x.id==='feed')extra=`<div class="staffopt"><label for="feedDays">Order more hay below</label><select id="feedDays" data-c="feeddays">${[3,5,7,10,14].map(n=>`<option value="${n}" ${S.feedDays===n?'selected':''}>${n} days’ worth</option>`).join('')}</select></div>`;
  if(x.id==='vet')extra=`<div class="staffopt"><button class="btn small" data-a="autovet">Seasonal checkups: ${S.autoVet?'On':'Off'}</button><span class="note">On the first day of each season, checks every healthy horse that hasn’t had one. Costs 25% more than doing it yourself (about ${money(Math.round(vetCost({})*1.25))} each).</span></div>`;
  if(x.id==='trainer')extra=`<div class="staffopt"><button class="btn small" data-a="autotrain">Evening training: ${S.autoTrain?'On':'Off'}</button><span class="note">Set each horse’s plan in its papers.</span></div>`;
  const days=S.day-p.hired;
  return `<div class="crew ${p.happy<30?'unhappy':''}"><span class="role">${x.n}</span>
   <div class="who"><b>${esc(p.name)}</b><span class="stars" aria-label="Skill ${p.skill} of 5">${stars(p.skill)}</span><span class="mono note">${money(wageOf(p,x.id))}/day</span></div>
   <div class="note">${p.bg?esc(p.bg)+' · '+p.yrs+' years in the trade · ':''}${days===0?'started today':days+(days===1?' day':' days')+' on the ranch'}</div>
   <div class="note">${p.trait}: ${STAFF_TRAITS[p.trait]}</div>${p.spec?`<div class="note specline">Specialty · ${specText(p,x.id)}</div>`:''}
   <div class="note">Mood <b class="${p.happy<30?'bad':p.happy>75?'good':''}">${Math.round(p.happy)}</b>${p.happy<20?' · <span class="bad">thinking about quitting</span>':p.happy<30?' · asking for more pay':''}</div>
   <div class="moodbar"><i style="width:${p.happy}%;background:${vitColor(p.happy)}"></i></div>

const HOWTO=`<ol>
  <li><b>Groom</b> every horse daily. It raises happiness (less when a horse is already very happy) and builds bond. Horses nobody grooms lose happiness overnight. A Stable Hand brushes horses each morning; the button then becomes <b>Groom +bond</b>, so you can still add your own bond.</li>
  <li><b>Train</b> one stat per horse per day. Stats rise toward each horse's potential (the pale part of the bar). Only breeding raises potential.</li>
  <li><b>Compete</b> at shows for prize money, reputation and ribbons. Each event weighs stats differently.</li>
  <li><b>Keep work varied.</b> Horses get sick of doing the same job or the same event over and over, and sour if worked 5+ days in a row. Mix up training, trail rides and shows, and give days off in the pasture. Horses with <i>Loves to Work</i>, <i>Creature of Habit</i> or <i>Show-Off</i> are different.</li>
  <li><b>Boarding</b> tab: send a horse to a training center (low, medium or elite) for fast training and a chance at new skills, or take in other owners’ horses for daily pay and a bonus if you meet their goals.</li>
  <li><b>Breed</b> your best mare to your best stallion. Foals inherit potential, natural skills and coat genes. Avoid breeding close family: inbred foals lose potential and can be born fragile. The breeding screen shows a family check.</li>
  <li>A <b>Trainer</b> (Staff tab) works your <b>idle</b> horses every evening when you press End Day. Idle means you didn’t use the horse that day: no training, riding, lessons, cattle work, events or pasture. Set each horse’s trainer priority and favorite stats in its papers. Cards show a <b>Trainer tonight</b> tag for horses the trainer will work.</li>
  <li>Instead of training, a horse can go out to <b>pasture</b>, on a <b>trail ride</b>, do <b>groundwork</b>, <b>give lessons</b> or <b>work cattle</b>. Use the “More…” menu.</li>
  <li>Pick <b>two things</b> to do yourself each day in the Your Day box: muck stalls, tend livestock, work with staff, help a neighbor, cut hay and more.</li>
  <li>Every horse has its own <b>stall</b> that gets dirtier each night. Dirty stalls hurt happiness and health.</li>
  <li><b>Hire staff</b> on the Staff tab. Each person has a skill level, a mood and a wage. Work with them to help them improve.</li>
  <li>Build up the place on the <b>Facilities</b> tab: barn, pastures, clinic, training areas, a track, staff housing and livestock that earn money.</li>
  <li><b>Injuries and illness</b> range from minor (a day or two) to severe (several seasons). Open the horse's papers to pick treatments. Your staff, clinic and spa unlock better, cheaper options. Serious injuries can leave a lasting weakness, and in very rare cases end a horse's competition career.</li>
  <li><b>Happiness</b> affects training, events, breeding, value and bond. Below 20 horses sulk and may refuse to work.</li>
  <li><b>Bond</b> grows from your personal care and fades without it. At 70+ horses can pick up <b>learned skills</b>.</li>
  <li>Breeds come in four rarities: <b>Common, Rare, Epic and Legendary</b>. Gear at the <b>Tack Shop</b> comes in the same four.</li>
  <li>You can <b>retire</b> a horse from events in its papers. It still breeds and works, and enjoys a happiness bonus. Past horses and champions are remembered on the <b>Hall of Fame</b> tab.</li>
  <li>Keep the <b>hay</b> stocked, then press <b>End Day</b>.</li></ol>
  <p class="note">Time: 4 days per season, 16 days per year. Foals become yearlings at 1 year and adults at 2. Seniors over 18 slowly lose condition.</p>`;

    <p class="note" style="margin-top:8px">Earn reputation by placing in the top 3, hosting open houses and shows, helping neighbors, big stud deals, and a fine Ranch House. Rarer horses show up at the sale barn as it grows.</p><p class="note">The bigger your name, the harder it grows: right now you get <b>${Math.round(repGainMult()*100)}%</b> of each gain. Local Shows stop adding reputation at 20, County fairs at 40, State Championships at 80 and Regionals at 130. If you go two seasons without earning any, it starts to fade. Maximum ${REP_MAX}.${S.rep>40?' Last gain: '+(S.lastRepGain?'day '+S.lastRepGain:'a while ago')+'.':''}</p>
   </div>
  </div>
  <div class="section-head" style="margin-top:22px"><h2>Reputation at Work</h2><span class="sub">Your name is worth +${Math.round((repSaleMult()-1)*100)}% on horse sales and offers, +${Math.round(Math.min(1,S.rep/150)*100)}% stud requests and +${Math.round(Math.min(.5,S.rep/300)*100)}% stud fees.</span></div>
  <div class="cols"><div class="panel"><div class="subh" style="margin-top:0">Sponsorship</div>${(()=>{const cur=S.sponsor&&SPONSORS.find(x=>x.id===S.sponsor.id);const off=!cur&&S.sponsorOffer&&SPONSORS.find(x=>x.id===S.sponsorOffer);
    if(cur)return `<div class="sponsor"><div class="grow"><b>${esc(cur.n)}</b><div class="note">${money(cur.pay)} a week for entering at least ${cur.starts} event${cur.starts>1?'s':''} a week. This week: <b>${S.weekStarts||0}/${cur.starts}</b>. ${S.sponsor.weeks} week${S.sponsor.weeks>1?'s':''} left${S.sponsor.strikes?' · '+S.sponsor.strikes+' strike':''}.</div></div><button class="btn small" data-a="dropsponsor">End deal</button></div>`;
    if(off)return `<div class="sponsor"><div class="grow"><b>${esc(off.n)}</b> wants to sponsor you.<div class="note">${money(off.pay)} a week for 4 weeks. You must enter at least ${off.starts} event${off.starts>1?'s':''} a week. Two missed weeks and they drop you (−3 reputation).</div></div><button class="btn small primary" data-a="takesponsor">Accept</button><button class="btn small" data-a="nosponsor">Decline</button></div>`;
    return `<p class="note">${S.rep<40?'Sponsors start calling at 40 reputation.':'No offer right now. Sponsors check in with the weekly market.'} Bigger brands come at 80 and 130.</p>`})()}</div>
   <div class="panel"><div class="subh" style="margin-top:0">What hurts your name</div><ul class="unlocks"><li><span class="n">−10</span><span>A horse dies from neglect</span></li><li><span class="n">−5</span><span>Missing payroll</span></li><li><span class="n">−3</span><span>Horses going hungry, or a sponsor dropping you</span></li><li><span class="n">−2</span><span>A staff member quitting, or leaving colic untreated</span></li><li><span class="n">−1</span><span>Each night with filthy stalls</span></li></ul></div></div>
  <div class="section-head" style="margin-top:22px"><h2>Ranch Goals</h2><span class="sub">${Object.keys(S.ach).length} of ${ACH.length} earned</span></div>
  <div class="ach">${ACH.map(a=>`<div class="${S.ach[a.id]?'got':''}"><b>${S.ach[a.id]?'★ ':''}${a.n}</b><span class="note">${a.d}${S.ach[a.id]?' Earned day '+S.ach[a.id]+'.':''}</span></div>`).join('')}</div>
  <div class="section-head" style="margin-top:22px"><h2>Save &amp; Load</h2></div>
  <div class="cols">${savePanel()}</div>
  <div class="section-head" style="margin-top:22px"><h2>Settings</h2></div>
  <div class="cols"><div class="panel"><div class="subh" style="margin-top:0">Ranch name</div>
    <div class="actions"><input type="text" id="ranchInput" value="${esc(S.ranchName)}" maxlength="32" aria-label="Ranch name"><button class="btn" data-a="renameRanch">Save name</button></div>
    <div class="subh">Start over</div><button class="btn danger" data-a="newgame">Start a new ranch</button> <span class="note">Your game saves automatically after every action.</span></div>
   <div class="panel"><details class="howto"><summary>How to play</summary>${HOWTO}</details></div></div>`;
}

function liveRec(h){return snapHorse(h,'here','On the ranch')}
function miniPortrait(r){return `<div class="portrait hofp${r.shiny?' shiny':''}">${horseSVG({id:r.id,genes:r.genes,breed:r.breed,cross:r.cross,blood:r.blood,born:S.day-ADULT*3,traits:r.traits||[]})}${shinyFx(r)}</div>`}
function ribbonLine(r){const c=r.ribbons||[0,0,0];return c[0]+c[1]+c[2]?`${c[0]?ribbonSVG(1,0,10)+' '+c[0]:''} ${c[1]?ribbonSVG(2,0,10)+' '+c[1]:''} ${c[2]?ribbonSVG(3,0,10)+' '+c[2]:''}`:'No ribbons'}
function hofCard(r){const why=hofReasons(r);return `<div class="hofcard r-${r.rarity}">${miniPortrait(r)}<div class="hofbody">
  <div class="hname"><h3>${esc(r.name)}</h3><span class="sexl">${r.sex==='M'?'Stallion':'Mare'}</span></div>
  <div class="breedline">${rbadge(r.rarity)}${shinyTag(r)}<span>${BREEDS[r.breed]?BREEDS[r.breed].n+(r.cross?' Cross':''):'Grade Horse'}</span></div>
  <div class="meta"><span class="mono">${r.reg}</span> · ${esc(r.coat)} · ${r.kind==='here'?'on the ranch, '+r.ageYrs+' yrs':esc(r.reason)}</div>
  ${why.length?`<div class="awardlist">${why.map(w=>`<span class="award">${esc(w)}</span>`).join('')}</div>`:''}
  <div class="note ribcount">${r.wins} wins in ${r.starts} starts · ${money(r.earnings)} · ${ribbonLine(r)}</div>
  <div class="note">${r.foals} foal${r.foals===1?'':'s'}${r.stud?' · '+r.stud+' outside mares':''}${r.awards.length?' · '+r.awards.length+' awards':''}</div>
  <div style="margin-top:6px"><button class="btn small" data-a="${r.kind==='here'?'open':'pastpapers'}" data-id="${r.id}">Papers</button></div></div></div>`}
function renderHof(){
  const mem=S.memorial||[];const all=[...S.horses.map(liveRec),...mem];
  const inducted=all.filter(r=>hofReasons(r).length).sort((a,b)=>b.earnings-a.earnings);
  const passed=mem.filter(r=>r.kind==='died').slice().reverse();const sold=mem.filter(r=>r.kind==='sold').slice().reverse();
  const best=(f,lbl,fmt)=>{const r=all.slice().sort((a,b)=>f(b)-f(a))[0];return r&&f(r)>0?`<div class="kpi"><span class="k">${lbl}</span><span class="v" style="font-size:16px;font-family:var(--f-body);font-weight:700">${esc(r.name)}</span><span class="s">${fmt(f(r))}${r.kind==='here'?'':' · '+(r.kind==='died'?'in memory':'former horse')}</span></div>`:''};
  return `<div class="section-head"><h2>Hall of Fame</h2><span class="sub">The horses that built ${esc(S.ranchName)}.</span></div>
  <div class="kpis">
   ${best(r=>r.wins,'Most wins',v=>v+' wins')}${best(r=>r.earnings,'Top earner',v=>money(v))}${best(r=>r.foals,'Most foals',v=>v+' foals')}${best(r=>(r.ribbons||[0,0,0]).reduce((a,b)=>a+b,0),'Most ribbons',v=>v+' ribbons')}${best(r=>r.gen>0?r.bestPot:0,'Best bred',v=>'potential '+v)}
   <div class="kpi"><span class="k">Remembered</span><span class="v">${passed.length}</span><span class="s">horses in memory · ${sold.length} sold</span></div>
  </div>
  <div class="section-head"><h2>Inductees</h2><span class="sub">Invitational and National champions, ten-time winners, $50,000 earners, foundation sires and dams (6+ foals) and exceptional homebreds.</span></div>
  ${inducted.length?`<div class="hofgrid">${inducted.map(hofCard).join('')}</div>`:'<div class="empty">No inductees yet. Win a National or Invitational, earn $50,000, rack up 10 wins, or raise a foundation sire or dam to see them here.</div>'}
  <div class="section-head" style="margin-top:24px"><h2>In Memoriam</h2><span class="sub">Horses that lived out their days on the ranch.</span></div>
  ${passed.length?`<div class="hofgrid">${passed.map(hofCard).join('')}</div>`:'<div class="empty">No horses have passed yet. Horses live about 24 to 30 years (16 game days per year).</div>'}
  <div class="section-head" style="margin-top:24px"><h2>Former Horses</h2><span class="sub">Horses you sold.</span></div>
  ${sold.length?`<div class="panel tablewrap"><table><tr><th>Horse</th><th>Breed</th><th class="n">Wins</th><th class="n">Earned</th><th class="n">Foals</th><th>Left the ranch</th></tr>${sold.map(r=>`<tr><td><button class="linkbtn" data-a="pastpapers" data-id="${r.id}"><b>${esc(r.name)}</b></button> <span class="note mono">${r.reg}</span></td><td>${rbadge(r.rarity)} ${BREEDS[r.breed]?BREEDS[r.breed].n:'Grade Horse'}</td><td class="n">${r.wins}</td><td class="n">${money(r.earnings)}</td><td class="n">${r.foals}</td><td>${esc(r.reason)}, day ${r.day}</td></tr>`).join('')}</table></div>`:'<div class="empty">You haven’t sold any horses yet.</div>'}`;
}
function renderJournal(){
  return `<div class="section-head"><h2>Ranch Journal</h2><span class="sub">Newest first.</span></div>
  <div class="panel"><ul class="log">${S.log.map(l=>`<li><span class="d">Day ${l.d}</span><span class="${l.k==='good'?'good':l.k==='bad'?'bad':l.k==='warn'?'warn':''}">${esc(l.t)}</span></li>`).join('')}</ul></div>`;
}

function pedCell(id,role){
  const r=id!=null?S.registry[id]:null;
  if(!r)return `<div class="ped ${role}"><div class="nm">Unknown</div><div class="rg">Unregistered stock</div></div>`;
  return `<div class="ped ${role}"><div class="nm">${esc(r.name)}</div><div class="rg">${r.reg} · ${r.breed?esc(r.breed)+' · ':''}${r.coat} · avg ${r.ap}</div>${r.blood&&isMixed(r.blood)?`<div class="rg pedblood">${bloodText(r.blood)}</div>`:''}${r.note?`<div class="pednote">${esc(r.note)}</div>`:''}</div>`;
}
function papers(h,mode){
  const c=coat(h.genes);const own=!mode;
  const w=own&&canWork(h)&&h.energy>=25;
  const sireR=h.sire!=null?S.registry[h.sire]:null,damR=h.dam!=null?S.registry[h.dam]:null;
  const statRows=STATS.map(s=>`<div class="statrow"><span><b>${s.n}</b></span><span class="bar"><span class="pot" style="width:${h.pot[s.k]}%"></span><span class="tr" style="width:${h.tr[s.k]}%"></span></span><span class="mono">${h.tr[s.k].toFixed(1)}/${h.pot[s.k]}</span>${own&&stage(h)!=='Foal'&&pregOk(h)?`<button class="btn small" data-a="train" data-id="${h.id}" data-k="${s.k}" ${w&&h.tr[s.k]<h.pot[s.k]?'':'disabled'}>Train</button>`:'<span></span>'}</div>`).join('');
  const v=value(h),sv=saleValue(h);
  const sellBtn=own&&!h.client?`<button class="btn danger" data-a="sell" data-id="${h.id}">Sell for ${money(sv)}</button>${vetClear(h)?'<span class="note good">Recent vet check: full price.</span>':'<span class="note">Buyers pay 10% less without a vet check in the last 8 days.</span>'}`:'';
  return `<div class="papers">
   <div><div class="portrait${h.shiny?' shiny':''}">${horseSVG(h)}${shinyFx(h)}${own?`<span class="pill ${status(h)[0]}">${status(h)[1]}</span>`:''}</div>
    <dl class="kv"><dt>Breed</dt><dd>${rbadge(rarityOf(h))} ${shinyTag(h)} <b>${breedLabel(h)}</b><div class="mono bloodline">${bloodText(bloodOf(h))}</div><div class="note">${(BREEDS[h.breed]||BREEDS.grade).d} Breed bonus: ${bonusText(h.breed||'grade')}.${h.cross?' Crossbred, so one rarity lower.':''}${h.vigor?' <b class="good">Hybrid vigor:</b> first cross of two purebreds, +2 potential on every stat and fewer injuries.':''}</div></dd><dt>Registry</dt><dd class="mono">${h.reg}</dd><dt>Sex · age</dt><dd>${sexLabel(h)} · ${ageLabel(h)} (${stage(h)})</dd>
    <dt>Coat</dt><dd>${c.full}${c.grey?' <span class="note">(born '+c.born+', greys out with age)</span>':''}</dd>
    <dt>Genotype</dt><dd class="mono" style="font-size:12.5px">${genotype(h.genes)}</dd>
    <dt>Origin</dt><dd>${esc(h.origin)}${h.gen?' · generation '+h.gen:''}</dd>
    ${h.retired?`<dt>Career</dt><dd class="bad">${h.retired.voluntary?'Retired by you':'Retired from events ('+esc(h.retired.why)+')'}, day ${h.retired.day}. Can still breed, teach lessons and do ranch work.</dd>`:''}
    ${h.prevCareer&&h.prevCareer.starts?`<dt>Previous ranch</dt><dd>${h.prevCareer.wins} wins in ${h.prevCareer.starts} starts and ${money(h.prevCareer.earn)} at ${esc(h.prevCareer.ranch)}</dd>`:''}
    <dt>Record</dt><dd>${h.wins} wins in ${h.starts} starts · ${money(h.earnings||0)} won</dd>
    ${own||(h.ribbons||[]).length?`<dt>Ribbons</dt><dd>${(()=>{const c=ribbonCounts(h);return c[0]+' blue · '+c[1]+' red · '+c[2]+' yellow · '+awardsOf(h).length+' awards'})()}</dd>`:''}
    ${h.sex==='M'?`<dt>Stud book</dt><dd>${h.studCount||0} outside mares bred · ${money(h.studEarned||0)} earned${own?`<div class="note">${studDemand(h)?'About a '+(studDemand(h)*100).toFixed(1)+'% chance each night that a ranch asks for him. Rarer breeds, higher potential, good natural skills, wins and your reputation raise it.':isAdult(h)?'No ranch will ask while he’s injured or unwell.':'Ranches will start asking once he’s grown (2 years).'}</div>`:''}</dd>`:''}
    <dt>Value</dt><dd><span class="mono">${money(v)}</span> <span class="note">(happiness ${happyValueMult(h)>=1?'+':''}${Math.round((happyValueMult(h)-1)*100)}%)</span>${own&&repSaleMult()>1.005?`<div class="note">Sells for <b class="mono">${money(sv)}</b> thanks to your reputation (+${Math.round((repSaleMult()-1)*100)}%).</div>`:''}</dd>
    ${h.coi!=null&&h.sire!=null?`<dt>Inbreeding</dt><dd><span class="mono">${pctTxt(h.coi)}</span> · ${coiLabel(h.coi)}</dd>`:''}
    ${h.breakthrough&&h.breakthrough.length?`<dt>Breakthrough</dt><dd class="good">${h.breakthrough.map(k=>STATS.find(s=>s.k===k).n).join(', ')}</dd>`:''}
    ${h.preg?`<dt>In foal to</dt><dd>${esc(h.preg.sire.name)}, due day ${h.preg.due}<div class="note">${pregLight(h)?'Early pregnancy: she can still train and work for '+Math.max(1,Math.ceil(GEST/3-pregDay(h)))+' more day'+(Math.ceil(GEST/3-pregDay(h))>1?'s':'')+' (no competing).':'Too far along to train. She goes out to pasture each day until she foals.'}</div></dd>`:''}
    ${mode==='stud'?`<dt>Stud fee</dt><dd class="mono">${money(h.fee)}</dd>`:''}</dl>
    ${own?`<div class="vitals" style="margin-top:12px">${vit('Energy',h.energy,vitColor(h.energy))}${vit('Happy',h.happy,vitColor(h.happy))}${vit('Health',h.health,vitColor(h.health))}</div><div class="vitals" style="margin-top:8px">${vit('Bond',h.bond,'var(--brass)')}${vit('Stall',stallOf(h),vitColor(stallOf(h)))}</div>
     <div class="moodbox"><div class="subh" style="margin:10px 0 4px">Mood &amp; workload</div>${moodNotes(h).map(([c,t])=>`<div class="note ${c}">• ${esc(t)}</div>`).join('')}${recentJobs(h).length?`<div class="note mono" style="margin-top:3px">Last 6 days: ${[...new Set(recentJobs(h).map(j=>j.k))].map(k=>jobName(k)+' ×'+Math.round(recentJobs(h).filter(j=>j.k===k).reduce((a,j)=>a+j.w,0)*10)/10).join(' · ')}</div>`:''}</div>
     <p class="note" style="margin-top:6px">Last cared for: ${careAge(h)===0?'today':careAge(h)===1?'yesterday':careAge(h)+' days ago'}. Bond grows at ${Math.round(bondMult(h)*100)}% speed at this happiness. Bond speeds training by ${Math.round(h.bond/4)}%${skillChance(h)?' and gives a '+(skillChance(h)*100).toFixed(1)+'% nightly chance to learn a skill':h.skills.length>=MAXSKILLS?'. Skills are full ('+MAXSKILLS+')':'. Reach 70 bond for a chance to learn skills'}.</p>`:''}
   </div>
   <div style="min-width:0">
    ${own&&h.inj?injuryPanel(h):''}
    <div class="subh" style="margin-top:0">Stats <span style="text-transform:none;letter-spacing:0;font-weight:500">(trained / potential)</span></div>${statRows}
    <p class="note smtnote">Smarts ${h.tr.smt.toFixed(1)}: learns <b class="${smtTrain(h)>=1?'good':'bad'}">${smtTrain(h)>=1?'+':'−'}${Math.abs(Math.round((smtTrain(h)-1)*100))}%</b> ${smtTrain(h)>=1?'faster':'slower'} · injury risk <b class="${smtInj(h)<=1?'good':'bad'}">${smtInj(h)<=1?'−':'+'}${Math.abs(Math.round((smtInj(h)-1)*100))}%</b>. Smart horses learn quicker and keep themselves out of trouble.</p>
    <div class="subh">Natural skills <span style="text-transform:none;letter-spacing:0;font-weight:500">(born with, passed to foals)</span></div>${h.traits.length?`<div class="traitlist">${h.traits.map(t=>`<div><b class="${TRAITS[t].rare?'warn':TRAITS[t].good?'good':'bad'}">${TRAITS[t].n}</b>${TRAITS[t].d}</div>`).join('')}</div>`:'<p class="note">No natural skills.</p>'}
    <div class="subh">Learned skills <span style="text-transform:none;letter-spacing:0;font-weight:500">(earned through bond, ${(h.skills||[]).length}/${MAXSKILLS}, not inherited)</span></div>${(h.skills||[]).length?`<div class="traitlist">${h.skills.map(k=>`<div><b style="color:var(--accent)">${SKILLS[k].n}</b>${SKILLS[k].d}</div>`).join('')}</div>`:'<p class="note">None yet. Horses with 70+ bond can pick up a skill overnight.</p>'}
    ${ribbonSection(h)}
    <div class="subh">Pedigree</div>
    <div class="pedigree">${pedCell(h.sire,'m')}${pedCell(h.dam,'f')}
     ${pedCell(sireR?sireR.sire:null,'m')}${pedCell(damR?damR.sire:null,'m')}
     ${pedCell(sireR?sireR.dam:null,'f')}${pedCell(damR?damR.dam:null,'f')}</div>
    <p class="note" style="margin-top:4px">Top row: sire and dam. Below: grandsires and granddams.</p>
    ${own?`<div class="subh">Care</div><div class="note" style="margin:-2px 0 6px">${groomStatus(h)}.</div><div class="actions">
     ${groomBtn(h,false)}
     <button class="btn" data-a="rest" data-id="${h.id}" ${canTurnout(h)?'':'disabled'}>Turn out to pasture</button>
     ${h.inj?'':vetDoneSeason(h)?`<button class="btn" disabled>Checked this season</button>`:`<button class="btn" data-a="vet" data-id="${h.id}">${h.preg?'Prenatal checkup':'Vet checkup'} · ${money(vetCost(h))}</button>`}
     ${h.sex==='F'&&isAdult(h)&&!h.preg?`<button class="btn" data-a="gobreed" data-id="${h.id}">Breed her</button>`:''}
     ${canCompete(h)?`<button class="btn" data-a="gocomp" data-id="${h.id}">Enter an event</button>`:''}</div>
     <div class="subh">Vet</div>${h.vetReport?`<div class="note"><b>Last checkup, day ${h.vetReport.day}:</b><br>${h.vetReport.lines.map(esc).join('<br>')}</div>`:''}
     <div class="note" style="margin:4px 0">${vetClear(h)?'<span class="good">Clean bill of health</span> (good for National and Invitational events and full sale price) until day '+(h.lastVet+8)+'.':'No recent checkup. National and Invitational events need one from the last 8 days.'}${vaccinated(h)?' · <span class="good">Vaccinated</span> until day '+h.vacc+'.':''} One checkup per season${vetDoneSeason(h)?' (done)':''}.</div>
     ${vetInfoPanel(h)}
     ${stage(h)!=='Foal'&&pregOk(h)?`<div class="subh">Other ways to spend the day</div><div class="traitlist">${JOBS.filter(j=>j.id!=='turnout'&&(!j.adult||isAdult(h))).map(j=>`<div style="display:flex;gap:10px;align-items:center"><button class="btn small" data-a="job" data-id="${h.id}" data-j="${j.id}" ${canWork(h)&&h.energy>=j.e?'':'disabled'}>${j.n}</button><span class="note">${j.d}${j.e?' Uses '+j.e+' energy.':''}</span></div>`).join('')}</div>`:''}
     ${trainerPlan(h)}
     ${gearSection(h)}
     <div class="subh">Rename</div><div class="actions"><input type="text" id="renameInput" value="${esc(h.name)}" maxlength="28" aria-label="Horse name"><button class="btn" data-a="rename" data-id="${h.id}">Save</button></div>
     ${h.client?`<div class="subh">Client horse</div><div class="note">Owned by ${esc(h.client.owner)} (${esc(h.client.farm)}). Leaves in ${h.client.until-S.day} day${h.client.until-S.day===1?'':'s'}.<br>${h.client.goals.map(g=>`<span class="${goalMet(g,h)?'good':'bad'}">${goalMet(g,h)?'✓':'○'} ${goalText(g,h)} (${goalProg(g,h)})</span>`).join('<br>')}</div>`:''}
     ${canSendAway(h)&&own?`<div class="subh">Training center</div><div class="actions"><button class="btn" data-a="awaytab" data-id="${h.id}">Send to a training center…</button></div>`:''}
     ${isAdult(h)&&!h.client?`<div class="subh">Career</div><div class="actions">${h.retired?(h.retired.voluntary?`<button class="btn" data-a="unretire" data-id="${h.id}">Bring out of retirement</button><span class="note">Retired by you on day ${h.retired.day}. Enjoying +1 happiness every night.</span>`:`<span class="note">Retired from events after ${esc(h.retired.why)}. This can’t be undone.</span>`):`<button class="btn" data-a="retire" data-id="${h.id}">Retire from events</button><span class="note">Stops competing for good (you can change your mind later). Still breeds, teaches lessons and works the ranch, gets +10 happiness now and +1 every night.</span>`}</div>`:''}
     ${h.client?'':`<div class="subh">Sell</div><div class="actions">${sellBtn}</div>`}`:''}
    ${mode==='market'?`<div class="actions" style="margin-top:14px"><button class="btn primary" data-a="buy" data-i="${S.market.indexOf(h)}">Buy for ${money(h.price)}</button></div>`:''}
   </div></div>`;
}

function navList(mode){return mode==='market'?S.market:mode==='stud'?S.studs:mode==='past'?(S.memorial||[]):S.horses}
function pastHorse(r){if(!r||!r.full)return null;const h=JSON.parse(JSON.stringify(r.full));h.born=S.day-(r.full.ageDays||0);h.past=r;return h}

    <ol><li><b>Groom</b> your horses every day to keep them happy, or hire a Stable Hand to do it.</li><li><b>Train</b> their stats with the small buttons on each card.</li><li><b>Compete</b> for prize money and reputation.</li><li><b>Breed</b> your best horses. Foals can beat their parents.</li><li>Press <b>End Day</b> when everyone has worked.</li></ol>

  ov.hidden=false;
}

  const rs=srng(m.wid*31+7);const field=m.res.field.map((f,i)=>{const met=evMetric(ev.id,f.score);const col=f.me?[myP.b,myP.m]:RUNNER_COLS[Math.floor(rs()*RUNNER_COLS.length)];return {...f,rank:i,met,col,silk:f.me?'#E2B007':SILKS[(i*3+1)%SILKS.length],ph:rs()*6.28,amp:.02+rs()*.03,pw:.7+rs()*.7}});

function crowdRows(x0,x1,y0,rows,gap,rs,op=.9){let o='';for(let r=0;r<rows;r++)for(let x=x0+(r%2)*5;x<x1;x+=gap){const c=SILKS[Math.floor(rs()*SILKS.length)],sk=['#F2D3B8','#E2B48C','#B98157','#7C5236'][Math.floor(rs()*4)];o+=`<rect x="${(x-3.4).toFixed(1)}" y="${y0+r*gap*1.1+3}" width="6.8" height="7" rx="2.4" fill="${c}" opacity="${op}"/><circle cx="${x.toFixed(1)}" cy="${y0+r*gap*1.1+1}" r="2.6" fill="${sk}"/>`}return o}

function render(){
  document.body.classList.toggle('titlemode',UI.screen==='title'||!S);
  if(UI.screen==='title'||!S){if(!S)UI.screen='title';renderTitle();renderModal();return}
  stopTitleAnim();
  svgN=0;renderHeader();
  const t=UI.tab;
  $('#main').innerHTML=tabBanner(t)+tutBanner()+(t==='stable'?renderStable():t==='breeding'?renderBreeding():t==='compete'?renderCompete():t==='market'?renderMarket():t==='tack'?renderTack():t==='boarding'?renderBoarding():t==='bank'?renderBank():t==='facilities'?renderFacilities():t==='staff'?renderStaff():(t==='office'||t==='ranch')?renderOffice():t==='hof'?renderHof():renderJournal());
  renderModal();
}

let toastT=0;
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2600)}

const ACT={
  tab:d=>{UI.tab=d.t;tutMark('tab_'+d.t)},
